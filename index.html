<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/output.css">
    <title>MyTodo</title>
</head>

<body class="bg-todo-bg p-5 text-todo-primary">
    <div class="w-full flex flex-row-reverse mt-5 gap-4">
        <div class="w-1/2 mx-auto border-2 border-todo-primary p-9 rounded-2xl flex flex-col gap-10">
            <h1 class="text-2xl font-bold">MY TODO</h1>
            <div class="w-full flex flex-row">
                <input id="todoInput"
                    class="outline-none hover:outline-none border border-todo-primary p-2 rounded-l-xl w-full"
                    type="text" placeholder="add todo new item">
                <button id="todoAddButton"
                    class="bg-todo-primary cursor-pointer rounded-r-xl p-3 text-todo-bg font-bold">Add</button>
            </div>
            <div>
                <p class="font-medium mb-2 underline">ToDos</p>
                <ul id="todoContainer" class="flex flex-col gap-3 justify-center">
                </ul>
            </div>
        </div>
        <div id="quoteContainer"
            class="w-1/2 mx-auto border-2 border-todo-primary p-9 rounded-2xl flex flex-col gap-10">

            <h1 class="text-2xl font-bold">Daily Quotes</h1>
        </div>
    </div>
    <script src="./src/js/app.js"></script>
</body>

</html>
